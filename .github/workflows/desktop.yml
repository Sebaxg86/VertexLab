name: Build VertexLab for Windows
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  desktop:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m unittest discover -s tests
      - run: python tools/build_desktop.py
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 7\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler is required on the Windows build image' }
          & $compiler installer\VertexLab.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: VertexLab-Windows
          path: |
            dist/installer/*.exe
            dist/VertexConnect/**
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $installers = Get-ChildItem dist\installer\*.exe | ForEach-Object { $_.FullName }
          if (-not $installers) { throw 'No installer executable found in dist/installer' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @installers --clobber
          } else {
            gh release create $tag @installers --title "VertexLab $tag" --generate-notes --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
