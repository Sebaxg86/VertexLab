name: Native Windows Preview
on:
  push:
    branches: [feature/windows-native]
    paths: ['native/**', '.github/workflows/native-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet test native/VertexLab.sln -c Release
      - run: ./native/tools/build.ps1
        shell: pwsh
      - run: ./native/tools/smoke.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: VertexLab-Native-Preview-win-x64
          path: native/artifacts/*.msi
